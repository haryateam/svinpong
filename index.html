<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>игрок VS свин | Harya Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            touch-action: manipulation;
        }

        /* Контейнер с плиточным фоном */
        .game-container {
            background-image: url('assets/bg.png');
            background-repeat: repeat;
            background-position: center;
            background-size: auto;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: none;
            background: rgba(0,0,0,0.2);
            width: 100%;
            height: auto;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 30px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            text-shadow: 0 2px 4px black;
            font-weight: bold;
        }

        .score {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: #1e2a3a;
            padding: 6px 20px;
            border-radius: 40px;
            font-family: monospace;
        }

        .score span {
            color: #ffd966;
            font-size: 2rem;
        }

        .controls-info {
            margin-top: 20px;
            text-align: center;
            color: #ccc;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            width: auto;
            padding: 6px 15px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .reset-btn {
            background: #ffaa33;
            border: none;
            color: #1e2a3a;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s;
        }
        .reset-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 700px) {
            .score-board {
                gap: 15px;
                padding: 8px 18px;
            }
            .score {
                font-size: 1.4rem;
                padding: 3px 14px;
            }
            .score span {
                font-size: 1.3rem;
            }
            .controls-info {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="score-board">
            <div class="score">ты <span id="playerScore">0</span></div>
            <div class="score">Свин аи <span id="aiScore">0</span></div>
            <button class="reset-btn" id="resetGameBtn">ресет</button>
        </div>
        <canvas id="pongCanvas" width="1000" height="600" style="width:100%; height:auto; max-width:1000px; aspect-ratio:1000/600"></canvas>
        <div class="controls-info">
            мышью или пальцем = движение ракетки
        </div>
        <footer>by Harya Team</footer>
    </div>
</div>

<script>
    (function(){
        // ---------- НАСТРОЙКИ ----------
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        
        // Размеры канваса (фикс для расчетов, но CSS адаптирует)
        let CW = 1000;
        let CH = 600;
        canvas.width = CW;
        canvas.height = CH;

        // ------ Загрузка текстур ------
        const ballImg = new Image();
        ballImg.src = 'assets/ball.png';   // ТВОЙ PNG для мяча
        const bgTile = new Image();
        bgTile.src = 'assets/bg.png';       // Плитка для заднего фона (будет поверх общего, но мы делаем бэк через контейнер, а здесь второй слой по желанию)
        // (основной фон плиткой задан в .game-container, можно оставить canvas прозрачным или нарисовать дополнительно)
        
        // музыка
        const bgMusic = new Audio('assets/music.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.4;
        // авто-воспроизведение после любого клика (чтобы не блокировал браузер)
        let musicStarted = false;
        function startMusic() {
            if(!musicStarted && bgMusic.src && bgMusic.src !== '') {
                bgMusic.play().catch(e=>console.log("авто-воспр. заблокировано, но пользователь кликнет"));
                musicStarted = true;
            }
        }
        // клик по документу запустит музыку
        document.body.addEventListener('click', () => {
            if(!musicStarted && bgMusic.src && bgMusic.src !== '') {
                bgMusic.play().catch(e=>console.log('ошибка аудио'));
                musicStarted=true;
            }
        }, {once:false});

        // ------ Игровые переменные ------
        let playerScore = 0;
        let aiScore = 0;
        const WIN_SCORE = 5;
        let gameActive = true;
        let winnerMsg = '';

        // Ракетки
        const PADDLE_WIDTH = 14;
        const PADDLE_HEIGHT = 100;
        let playerY = CH/2 - PADDLE_HEIGHT/2;
        let aiY = CH/2 - PADDLE_HEIGHT/2;
        const AI_SPEED = 2.4;   // базовая скорость, увеличивается с отрывом счета
        
        // Мяч
        let ball = {
            x: CW/2,
            y: CH/2,
            vx: 2.1,
            vy: 3.2,
            radius: 12
        };
        
        // Флаг для рестарта после победы
        let freezeFrame = false;
        let restartTimer = null;

        // Управление мышью/тачем
        let isDragging = false;
        
        function getMouseY(clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleY = CH / rect.height;
            let y = (clientY - rect.top) * scaleY;
            return Math.min(Math.max(y, 0), CH - PADDLE_HEIGHT);
        }
        
        function handleMove(e) {
            if(!gameActive) return;
            e.preventDefault();
            let clientY;
            if(e.touches) {
                clientY = e.touches[0].clientY;
            } else {
                clientY = e.clientY;
            }
            playerY = getMouseY(clientY);
        }
        
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove, {passive:false});
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); if(e.touches) handleMove(e); });
        
        // ----- Отрисовка с текстурой мяча и плиткой по желанию -----
        function draw() {
            ctx.clearRect(0, 0, CW, CH);
            
            // Можно дополнительно залить канвас полупрозрачным слоем, чтобы фон контейнера просвечивал
            ctx.fillStyle = 'rgba(10, 15, 25, 0.45)';
            ctx.fillRect(0, 0, CW, CH);
            
            // Разделительная линия
            ctx.beginPath();
            ctx.setLineDash([12, 16]);
            ctx.strokeStyle = 'rgba(255,240,180,0.7)';
            ctx.lineWidth = 2;
            ctx.moveTo(CW/2, 0);
            ctx.lineTo(CW/2, CH);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // ракетки
            ctx.fillStyle = '#e6e9f0';
            ctx.shadowBlur = 6;
            ctx.fillRect(10, playerY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillRect(CW - 10 - PADDLE_WIDTH, aiY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.shadowBlur = 0;
            
            // мяч (с картинкой, если загружена)
            if(ballImg.complete && ballImg.naturalWidth > 0) {
                ctx.drawImage(ballImg, ball.x - ball.radius, ball.y - ball.radius, ball.radius*2, ball.radius*2);
            } else {
                ctx.beginPath();
                ctx.fillStyle = '#ffaa44';
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.arc(ball.x-2, ball.y-2, 3, 0, Math.PI*2);
                ctx.fill();
            }
            
            // счет победителя
            if(!gameActive && winnerMsg) {
                ctx.font = 'bold 32px "Segoe UI"';
                ctx.fillStyle = '#ffdd99';
                ctx.shadowBlur = 0;
                ctx.fillText(winnerMsg, CW/2 - ctx.measureText(winnerMsg).width/2, CH/2 - 40);
                ctx.font = '18px monospace';
                ctx.fillStyle = '#ccccaa';
                ctx.fillText('для ресета нажмите по полю или кнопку', CW/2 - 150, CH/2 + 30);
            }
        }
        
        // ------ ИИ с прогрессией сложности (чем больше счет, тем быстрее) -----
        function updateAI() {
            let targetY = ball.y - PADDLE_HEIGHT/2;
            let diff = targetY - aiY;
            let currentSpeed = AI_SPEED + (playerScore + aiScore) * 0.28;  // сложность растёт
            if(Math.abs(diff) > currentSpeed) {
                aiY += Math.sign(diff) * currentSpeed;
            } else {
                aiY = targetY;
            }
            aiY = Math.min(Math.max(aiY, 0), CH - PADDLE_HEIGHT);
        }
        
        // ------ Обновление логики -----
        function updateBall() {
            if(!gameActive) return;
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // стены верх/низ
            if(ball.y - ball.radius <= 0) {
                ball.y = ball.radius;
                ball.vy = -ball.vy;
            }
            if(ball.y + ball.radius >= CH) {
                ball.y = CH - ball.radius;
                ball.vy = -ball.vy;
            }
            
            // левая ракетка (игрок)
            if(ball.vx < 0 && ball.x - ball.radius <= 10 + PADDLE_WIDTH) {
                if(ball.y + ball.radius >= playerY && ball.y - ball.radius <= playerY + PADDLE_HEIGHT) {
                    let hitPos = (ball.y - playerY) / PADDLE_HEIGHT;
                    let angle = (hitPos - 0.5) * 1.1;
                    ball.vx = -ball.vx * 1.02;
                    ball.vy = ball.vy + angle * 5;
                    // нормализация
                    let spd = Math.hypot(ball.vx, ball.vy);
                    let maxSpd = 9.5;
                    if(spd > maxSpd) {
                        ball.vx = ball.vx / spd * maxSpd;
                        ball.vy = ball.vy / spd * maxSpd;
                    }
                    ball.x = 10 + PADDLE_WIDTH + ball.radius;
                } else if(ball.x - ball.radius <= 0) {
                    // ОЧКО У AI
                    aiScore++;
                    updateScoreUI();
                    if(aiScore >= WIN_SCORE) endGame('свин победил');
                    else resetBall('ai');
                }
            }
            
            // правая ракетка AI
            if(ball.vx > 0 && ball.x + ball.radius >= CW - 10 - PADDLE_WIDTH) {
                if(ball.y + ball.radius >= aiY && ball.y - ball.radius <= aiY + PADDLE_HEIGHT) {
                    let hitPos = (ball.y - aiY) / PADDLE_HEIGHT;
                    let angle = (hitPos - 0.5) * 1.1;
                    ball.vx = -ball.vx * 1.02;
                    ball.vy = ball.vy + angle * 5;
                    let spd = Math.hypot(ball.vx, ball.vy);
                    if(spd > 9.5) {
                        ball.vx = ball.vx / spd * 9.5;
                        ball.vy = ball.vy / spd * 9.5;
                    }
                    ball.x = CW - 10 - PADDLE_WIDTH - ball.radius;
                } else if(ball.x + ball.radius >= CW) {
                    playerScore++;
                    updateScoreUI();
                    if(playerScore >= WIN_SCORE) endGame('свин побежден');
                    else resetBall('player');
                }
            }
        }
        
        function resetBall(scorer) {
            ball.x = CW/2;
            ball.y = CH/2;
            ball.vx = (scorer === 'player' ? -4.2 : 4.2) * (Math.random() > 0.5 ? 1 : -1);
            ball.vy = (Math.random() * 6 - 3);
            if(Math.abs(ball.vy) < 1.2) ball.vy = ball.vy > 0 ? 1.8 : -1.8;
        }
        
        function updateScoreUI() {
            document.getElementById('playerScore').innerText = playerScore;
            document.getElementById('aiScore').innerText = aiScore;
        }
        
        function endGame(msg) {
            gameActive = false;
            winnerMsg = msg;
            freezeFrame = true;
            if(restartTimer) clearTimeout(restartTimer);
            // автоматический рестарт через 2.5 секунды (опционально)
            restartTimer = setTimeout(() => {
                fullReset();
            }, 2600);
        }
        
        function fullReset() {
            playerScore = 0;
            aiScore = 0;
            updateScoreUI();
            gameActive = true;
            winnerMsg = '';
            freezeFrame = false;
            playerY = CH/2 - PADDLE_HEIGHT/2;
            aiY = CH/2 - PADDLE_HEIGHT/2;
            ball.x = CW/2;
            ball.y = CH/2;
            ball.vx = (Math.random() > 0.5 ? 4.2 : -4.2);
            ball.vy = (Math.random() * 5 - 2.5);
            if(Math.abs(ball.vy) < 1) ball.vy = ball.vy > 0 ? 1.8 : -1.8;
            if(restartTimer) clearTimeout(restartTimer);
            // сброс музыку не трогаем
        }
        
        // кнопка ручного сброса
        document.getElementById('resetGameBtn').addEventListener('click', () => {
            if(restartTimer) clearTimeout(restartTimer);
            fullReset();
        });
        
        // цикл анимации
        let lastTimestamp = 0;
        function gameLoop() {
            if(!freezeFrame) {
                if(gameActive) {
                    updateAI();
                    updateBall();
                }
            }
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // предзагрузка и старт
        window.addEventListener('load', () => {
            // проверка наличия изображений
            if(ballImg.src === 'assets/ball.png' && ballImg.naturalWidth === 0) {
                console.log('ожидание загрузки мяча');
            }
            updateScoreUI();
            gameLoop();
            // первоначальный сброс позиций
            fullReset();
            // обработка ресайза для корректного сенсора
            window.addEventListener('resize', () => {});
        });
        
        // старт музыки после первой активности
        function enableMusicOnUserAction() {
            startMusic();
            document.body.removeEventListener('click', enableMusicOnUserAction);
            document.body.removeEventListener('touchstart', enableMusicOnUserAction);
        }
        document.body.addEventListener('click', enableMusicOnUserAction);
        document.body.addEventListener('touchstart', enableMusicOnUserAction);
    })();
</script>
</body>
</html>
